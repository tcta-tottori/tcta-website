# 管理アプリ（admin/）の配信と、保存・公開の API を担う Cloudflare Worker。
# デプロイ手順は docs/admin.md を参照。
name = "tcta-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 管理アプリの静的ファイル。/api/* 以外はここから直接返る。
[assets]
directory = "../admin"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# 下書き・アップロード中の画像・公開履歴の置き場。
# `npx wrangler kv namespace create DRAFTS` で作り、出てきた id をここに書く。
[[kv_namespaces]]
binding = "DRAFTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
GITHUB_REPO = "tcta-tottori/tcta-website"
GITHUB_BRANCH = "main"
# 公開サイト。管理アプリのプレビューが CSS と公開ずみ画像をここから読む
SITE_URL = "https://tcta-tottori.github.io/tcta-website/"
# コミットの作者に使うメールアドレス（編集者名は管理アプリのログイン名）
COMMIT_EMAIL = "admin@tottori-tenis.net"

# 秘密情報は wrangler secret put で入れる（リポジトリには置かない）
#   GITHUB_TOKEN    … Fine-grained PAT（対象リポジトリの Contents: Read and write / Actions: Read）
#   SESSION_SECRET  … ログインの署名に使う長いランダム文字列
#   EDITORS         … 編集者とパスワードのハッシュ（scripts/hash-password.mjs で作る JSON）
