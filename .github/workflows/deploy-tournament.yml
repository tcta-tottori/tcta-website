name: Deploy tournament app to Cloudflare Workers

# 大会運営システム（Cloudflare 版、tournament/）の配備。公式サイト本体（deploy.yml）・会員システム（deploy-members.yml）とは別の Worker。
# GitHub Pages 版（tcta-tottori/tournament-management-app）はそのまま残り、こちらは別の URL で動く。
#   https://tcta-tournament.tcta-admin-worker.workers.dev/
# tournament/（と、見た目の元になる協会サイトの CSS・ロゴ）を変更して push すると配備する。公式サイト本体と同じ Secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）を使う。
# 中継（Durable Object「SyncRoom」）は最初の配備で作られる（wrangler.jsonc の migrations）。
# リポジトリの Secrets に GEMINI_API_KEY があれば、音声コール（Gemini TTS）の鍵として Worker に入れる（無ければブラウザ内蔵の声だけ）。
# 役員ログイン（Cloudflare Access）: 配備のたびに tournament/scripts/setup-access.mjs が API で Access の設定をそろえ
#   （/auth を守るアプリケーション・Secrets の OFFICER_EMAILS から作る役員の許可・メールのコードでのログイン）、
#   チームのドメインと AUD を Worker に入れる。API トークンに Access の権限が無い・Zero Trust が未開始のときは
#   リポジトリの Variables の ACCESS_TEAM_DOMAIN・ACCESS_AUD を使い、それも無ければ運営の操作はすべて断られる（閉じた側のまま）。
#   OFFICER_EMAILS は Worker にも二重の鍵として入れる。手順は tournament/README.md の「役員ログイン」。
on:
  push:
    branches: [main, ccr-adeb62f8-4n5xza]
    # 見た目は協会サイトの CSS・ロゴをそのまま使う（tournament/scripts/sync-site.mjs）ので、それが変わったときも配備し直す
    paths: ['tournament/**', 'public/assets/css/style.css', 'public/assets/img/logo-cut*.png', '.github/workflows/deploy-tournament.yml']
  workflow_dispatch:

concurrency:
  group: deploy-tournament
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tournament
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: https://tcta-tournament.tcta-admin-worker.workers.dev
      # secrets は if: で直接読めないので、有無だけを env に移す
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_OFFICER_EMAILS: ${{ secrets.OFFICER_EMAILS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tournament/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      # 役員ログインの証明の検証（自分で作った鍵で署名した証明で確かめる）
      - run: npm run test:auth
      - run: npm run build
      # 役員ログイン（Cloudflare Access）を API でそろえ、チームのドメインと AUD を次の配備に渡す。失敗しても配備は続ける
      - name: Configure officer login (Cloudflare Access)
        id: access
        env:
          OFFICER_EMAILS: ${{ secrets.OFFICER_EMAILS }}
        run: node scripts/setup-access.mjs
      - name: Deploy worker (creates the Durable Object on first run)
        env:
          ACCESS_TEAM_DOMAIN: ${{ steps.access.outputs.team || vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ steps.access.outputs.aud || vars.ACCESS_AUD }}
        run: |
          args=()
          if [ -n "$ACCESS_TEAM_DOMAIN" ]; then args+=(--var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN"); fi
          if [ -n "$ACCESS_AUD" ]; then args+=(--var "ACCESS_AUD:$ACCESS_AUD"); fi
          npx wrangler deploy "${args[@]}"
      - name: Set Gemini API key (only when the repository has one)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: env.HAS_GEMINI_KEY == 'true'
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
      - name: Set officer emails (only when the repository has them)
        env:
          OFFICER_EMAILS: ${{ secrets.OFFICER_EMAILS }}
        if: env.HAS_OFFICER_EMAILS == 'true'
        run: printf '%s' "$OFFICER_EMAILS" | npx wrangler secret put OFFICER_EMAILS
      - name: Smoke test against the deployed app
        run: |
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/api/health" && break
            sleep 2
          done
          BASE="$APP_URL" npm test
