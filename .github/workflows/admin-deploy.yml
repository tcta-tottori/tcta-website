name: Deploy admin worker

# 管理アプリ（admin/）と Worker（worker/）が変わったときだけ Cloudflare に配備する。
# 必要な Secrets（リポジトリの Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN … Workers Scripts: Edit / Workers KV Storage: Edit を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
# Worker 側の秘密情報（GITHUB_TOKEN / SESSION_SECRET / EDITORS）は wrangler secret put で別途入れる。
on:
  push:
    branches: [main]
    paths: ['admin/**', 'worker/**', '.github/workflows/admin-deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: worker
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
