name: Deploy members portal to Cloudflare Workers

# 会員登録・大会エントリー一元管理システム（members/）の配備。公式サイト本体（deploy.yml）とは別の Worker。
#   demo       … 誰でも触れるデモ（tcta-members-demo.*.workers.dev）。members/ を変更して push すると自動で配備
#   production … 本番（tcta-members）。Actions の画面から手動で実行する（事前に members/README.md の secrets が必要）
# 公式サイト本体と同じ Secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）を使う。
# D1 は最初の deploy で名前どおりに作られ、そのあとマイグレーションを当てる。
on:
  push:
    branches: [main, ccr-6d83d2aa-cnnzst]
    paths: ['members/**', '.github/workflows/deploy-members.yml']
  workflow_dispatch:
    inputs:
      target:
        description: '配備先'
        type: choice
        options: [demo, production]
        default: demo

concurrency:
  group: deploy-members-${{ inputs.target || 'demo' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: members
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # production は既定の環境（--env なし）、demo は --env demo
      WRANGLER_ENV_FLAG: ${{ (inputs.target || 'demo') == 'production' && '' || '--env demo' }}
      DB_NAME: ${{ (inputs.target || 'demo') == 'production' && 'tcta-members' || 'tcta-members-demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: members/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 公式サイト本体の CSS / JS / ロゴを members/public/assets に複製する（見た目と動きを本体にそろえる）
      - run: npm run sync-assets
      - name: Deploy worker (creates the D1 database on first run)
        run: npx wrangler deploy $WRANGLER_ENV_FLAG
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote $WRANGLER_ENV_FLAG
