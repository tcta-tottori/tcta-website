name: Deploy members portal to Cloudflare Workers

# 会員登録・大会エントリー一元管理システム（members/）の配備。公式サイト本体（deploy.yml）とは別の Worker。
# まだサンプル段階なので自動では配備せず、Actions の画面から手動で実行する。
# 事前に members/README.md「本番に配備するとき」の手順（D1 の作成、secrets、database_id）が必要。
on:
  workflow_dispatch:

concurrency:
  group: deploy-members
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: members
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: members/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler d1 migrations apply tcta-members --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
