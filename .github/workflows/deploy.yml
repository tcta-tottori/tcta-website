name: Deploy to GitHub Pages

on:
  push:
    # スマホから調整する間だけ、作業ブランチも公開対象にしている。
    # main にマージして調整が終わったら claude/** の行は消してよい。
    branches: [main, 'claude/**']
  # 手動実行
  workflow_dispatch:
  # 段階3で microCMS の Webhook から発火させる
  repository_dispatch:
    types: [microcms-update]

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のものは新しい内容で置き換える。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
