name: Deploy site to Cloudflare Workers

# main への push で公式サイト（Astro ＋ EmDash）を Cloudflare Workers に配備する。
# 必要な Secrets（リポジトリの Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN … Workers Scripts: Edit / D1: Edit / Workers R2 Storage: Edit を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
# Worker 側の秘密情報（EMDASH_ENCRYPTION_KEY）は wrangler secret put で別途入れる（docs/emdash.md）。
#
# 内容（お知らせ・大会）は D1 にあり、配備しても変わらない。
# 公開ページのキャッシュは cross_version_cache なので、配備後もしばらく前の見た目が残ることがある
# （内容を公開し直すか、キャッシュの期限（1日）で入れ替わる）。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 配備は同時に1つだけ。実行中のものは新しい内容で置き換える。
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ビルド中に Google フォントのファイルを取りに行く。通信が一時的に失敗すると止まる（2026-11-01 に発生）ので、
      # 失敗したら少し待って最大3回までやり直す
      - name: Build (最大3回までやり直す)
        run: |
          for i in 1 2 3; do
            npm run build && exit 0
            echo "build failed (attempt $i). retrying in $((i * 15))s..."
            sleep $((i * 15))
          done
          exit 1

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
